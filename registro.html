<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevWeb — Cadastro de Usuário</title>
    <link rel="stylesheet" href="styleHome.css">
</head>

<body>
    <!-- Topbar Desktop: Botão de voltar no canto esquerdo -->
    <header class="header-desktop">
        <a href="index.html" onclick="history.back(); return false;" class="btn-voltar">
            🠔
        </a>
        <a href="index.html" class="header-brand">🎓 DevWeb — Acesso ao Sistema</a>
    </header>

    <!-- Topbar Mobile com botão de retornar -->
    <header class="header-mobile">
        <a href="index.html" onclick="history.back(); return false;" class="btn-voltar-mobile">←</a>
        <div class="header-mobile-title">Criar Nova Conta</div>
        <div style="width: 50px;"></div>
    </header>

    <main class="container">
        <div class="register-wrapper">
            <section class="card">
                <div class="card-header">
                    <h2>Criar Conta no Sistema</h2>
                    <p class="register-header-desc">Preencha os dados abaixo para vincular seu perfil à instituição</p>
                </div>

                <!-- O formulário só envia e redireciona após a validação nativa de todos os campos -->
                <form action="entrar.html" method="GET">
                    <div class="register-grid">
                        <div class="form-group">
                            <label for="nome">Nome Completo:</label>
                            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                        </div>

                        <div class="form-group">
                            <label for="email">E-mail Institucional:</label>
                            <input type="email" id="email" name="email" placeholder="seu.nome@escola.edu.br" required>
                        </div>

                        <div class="form-group">
                            <label for="documento">CPF ou Matrícula:</label>
                            <input type="text" id="documento" name="documento" placeholder="000.000.000-00" required>
                        </div>

                        <div class="form-group">
                            <label for="perfil">Perfil de Acesso Solicitado:</label>
                            <select id="perfil" name="perfil" required>
                                <option value="" disabled selected>Selecione uma opção...</option>
                                <option value="docente">Docente / Professor</option>
                                <option value="coordenacao">Coordenação Pedagógica</option>
                                <option value="discente">Discente / Aluno</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="senha-cad">Senha de Acesso:</label>
                            <input type="password" id="senha-cad" name="senha" placeholder="Crie uma senha segura..."
                                minlength="6" required>
                        </div>

                        <div class="form-group register-field-confirm">
                            <label for="confirmar-senha">Confirmar Senha:</label>
                            <input type="password" id="confirmar-senha" name="confirmar_senha"
                                placeholder="Repita sua senha" minlength="6" required>
                        </div>
                    </div>

                    <div class="form-terms">
                        <input type="checkbox" id="termos" name="termos" required>
                        <label for="termos">Concordo com os termos de uso e políticas de privacidade pedagógica da
                            escola.</label>
                    </div>

                    <button type="submit" class="btn btn-purple btn-block">Concluir e Criar Conta</button>

                    <a href="entrar.html" class="register-footer-link">Já possui uma conta? Faça login aqui</a>
                </form>
            </section>
        </div>
    </main>

</body>

</html>
