<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevWeb — Acesso ao Sistema</title>
    <link rel="stylesheet" href="styleHome.css">
    <style>
        /* Ajuste para alinhar o seletor com o texto do portal */
        .portal-option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
        }

        .portal-option input[type="radio"] {
            margin-top: 3px;
            accent-color: var(--primary-green);
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Destaque visual ao selecionar o card */
        .portal-option:has(input:checked) {
            outline: 2px solid var(--text-title);
            transform: translateX(4px);
        }

        /* Oculta os botões específicos cujo portal NÃO está selecionado */
        body:not(:has(#portal-docente:checked)) .btn-portal-docente,
        body:not(:has(#portal-coordenacao:checked)) .btn-portal-coordenacao,
        body:not(:has(#portal-discente:checked)) .btn-portal-discente {
            display: none !important;
        }

        /* Oculta o botão predefinido assim que qualquer portal for selecionado */
        body:has(input[name="portal"]:checked) .btn-portal-default {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- Topbar Desktop -->
    <header class="header-desktop">
        <a href="index.html" class="btn-voltar">
            🠔
        </a>
        <a href="index.html" class="header-brand">🎓 DevWeb — Acesso ao Sistema</a>
    </header>

    <!-- Topbar Mobile -->
    <header class="header-mobile">
        <a href="index.html" class="btn-voltar-mobile">←</a>
        <div class="header-mobile-title">Acessar Conta</div>
        <div style="width: 50px;"></div>
    </header>

    <main class="container">
        <div class="login-grid">

            <!-- Seleção Obrigatória de Portais -->
            <section>
                <div class="card-header desktop-only">
                    <h2>Selecione seu Perfil de Acesso</h2>
                    <p>Escolha o portal correspondente à sua função:</p>
                </div>

                <span class="portal-section-label">Selecione seu Portal:</span>

                <div class="portal-list">
                    <label class="portal-option docente">
                        <input type="radio" id="portal-docente" name="portal" value="docente.html" form="form-login"
                            required>
                        <div class="portal-info">
                            <h4>Portal do Docente</h4>
                            <p>Acesso de professores, observações por aluno e registro de evidências.</p>
                        </div>
                    </label>

                    <label class="portal-option coordenacao">
                        <input type="radio" id="portal-coordenacao" name="portal" value="coordenacao.html"
                            form="form-login" required>
                        <div class="portal-info">
                            <h4>Portal da Coordenação</h4>
                            <p>Painel de clima escolar, gestão analítica e alertas precoces.</p>
                        </div>
                    </label>

                    <label class="portal-option discente">
                        <input type="radio" id="portal-discente" name="portal" value="discente.html" form="form-login"
                            required>
                        <div class="portal-info">
                            <h4>Portal do Discente</h4>
                            <p>Autoavaliação formativa e progresso contínuo do aluno.</p>
                        </div>
                    </label>
                </div>
            </section>

            <!-- Formulário de Credenciais -->
            <section class="card">
                <div class="card-header">
                    <h2>Identificação do Usuário</h2>
                    <p>Insira suas credenciais institucionais</p>
                </div>

                <form id="form-login" action="#" method="GET">
                    <div class="form-group">
                        <label for="identificador">E-mail Institucional ou CPF:</label>
                        <input type="text" id="identificador" name="identificador" placeholder="E-mail ou CPF..."
                            required>
                    </div>

                    <div class="form-group">
                        <label for="senha">Senha de Acesso:</label>
                        <input type="password" id="senha" name="senha" placeholder="Sua senha de acesso..." required>
                    </div>

                    <!-- Botões Mobile (exibidos após o preenchimento dos campos) -->
                    <button type="submit"
                        class="btn btn-green btn-block mobile-login-btn btn-portal-default">Entrar</button>
                    <button type="submit" formmethod="GET" formaction="docente.html"
                        class="btn btn-green btn-block mobile-login-btn btn-portal-docente">Entrar</button>
                    <button type="submit" formmethod="GET" formaction="coordenacao.html"
                        class="btn btn-green btn-block mobile-login-btn btn-portal-coordenacao">Entrar</button>
                    <button type="submit" formmethod="GET" formaction="discente.html"
                        class="btn btn-green btn-block mobile-login-btn btn-portal-discente">Entrar</button>

                    <!-- Botões Desktop -->
                    <button type="submit"
                        class="btn btn-green btn-block desktop-login-btn btn-portal-default">Autenticar e
                        Entrar</button>
                    <button type="submit" formmethod="GET" formaction="docente.html"
                        class="btn btn-green btn-block desktop-login-btn btn-portal-docente">Autenticar e
                        Entrar</button>
                    <button type="submit" formmethod="GET" formaction="coordenacao.html"
                        class="btn btn-green btn-block desktop-login-btn btn-portal-coordenacao">Autenticar e
                        Entrar</button>
                    <button type="submit" formmethod="GET" formaction="discente.html"
                        class="btn btn-green btn-block desktop-login-btn btn-portal-discente">Autenticar e
                        Entrar</button>

                    <a href="#" class="forgot-link">Esqueceu sua senha? Clique aqui para recuperar</a>
                </form>
            </section>

        </div>
    </main>

</body>

</html>
